aid: lily
name: Lily Camera
description: >-
  The domain lily.camera currently serves "Lily Camera", a consumer-facing
  marketplace that connects clients with certified drone pilots for aerial
  photography and videography across real estate, events, agriculture,
  construction, and media production. It is a client-rendered single-page
  application: every requested path returns the same HTML shell, and the
  routes defined in its JavaScript bundle cover browsing pilots and drones,
  comparisons, bookings, messaging, a pilot dashboard, and a drone raffle.
  There is no public API, no developer portal, no documentation, no OpenAPI
  or other machine-readable specification, no SDKs, and no /.well-known
  discovery surface. The site is built on Lovable (GPT Engineer), monetized
  with Google AdSense, and backed by a hosted Supabase project. No API
  artifacts could be harvested because the provider publishes none.
